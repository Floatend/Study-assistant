serverAddr = "{{ .Envs.FRP_SERVER_ADDR }}"
serverPort = {{ .Envs.FRP_SERVER_PORT }}
loginFailExit = false

auth.method = "token"
auth.token = "{{ .Envs.FRP_AUTH_TOKEN }}"

transport.tls.enable = true

[[proxies]]
name = "goalbot-web"
type = "tcp"
localIP = "goalbot-frontend"
localPort = 80
remotePort = {{ .Envs.FRP_REMOTE_PORT }}
