services:
  goalbot-mysql:
    image: mysql:8.4
    container_name: goalbot-mysql
    restart: unless-stopped
    environment:
      TZ: Asia/Shanghai
      MYSQL_DATABASE: goalbot
      MYSQL_USER: ${MYSQL_USERNAME:-goalbot}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:?MYSQL_PASSWORD is required}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?MYSQL_ROOT_PASSWORD is required}
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
      - --default-time-zone=+08:00
    volumes:
      - goalbot_mysql_data:/var/lib/mysql
      - ./goalbot-backend/sql/init.sql:/docker-entrypoint-initdb.d/001-init.sql:ro
      - ./goalbot-backend/sql/multi_user_auth.sql:/docker-entrypoint-initdb.d/002-multi-user-auth.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -u root -p$${MYSQL_ROOT_PASSWORD} --silent"]
      interval: 10s
      timeout: 5s
      retries: 12
    networks:
      - goalbot-net

  goalbot-backend:
    build:
      context: ./goalbot-backend
      dockerfile: Dockerfile
    container_name: goalbot-backend
    restart: unless-stopped
    depends_on:
      goalbot-mysql:
        condition: service_healthy
    environment:
      TZ: Asia/Shanghai
      SERVER_PORT: 8080
      MYSQL_URL: jdbc:mysql://goalbot-mysql:3306/goalbot?useUnicode=true&characterEncoding=utf8&useSSL=false&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true
      MYSQL_USERNAME: ${MYSQL_USERNAME:-goalbot}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:?MYSQL_PASSWORD is required}
      GOALBOT_BOOTSTRAP_ADMIN_USERNAME: ${GOALBOT_BOOTSTRAP_ADMIN_USERNAME:-local_user}
      GOALBOT_BOOTSTRAP_ADMIN_PASSWORD: ${GOALBOT_BOOTSTRAP_ADMIN_PASSWORD:?GOALBOT_BOOTSTRAP_ADMIN_PASSWORD is required}
      GOALBOT_AUTH_SESSION_DAYS: ${GOALBOT_AUTH_SESSION_DAYS:-30}
      GOALBOT_REMINDER_ENABLED: ${GOALBOT_REMINDER_ENABLED:-true}
      DIFY_ENABLED: ${DIFY_ENABLED:-true}
      DIFY_API_URL: ${DIFY_API_URL:-}
      DIFY_API_KEY: ${DIFY_API_KEY:-}
      DIFY_WORKFLOW_API_URL: ${DIFY_WORKFLOW_API_URL:-}
      DIFY_WORKFLOW_API_KEY: ${DIFY_WORKFLOW_API_KEY:-}
      DIFY_TIMEOUT_SECONDS: ${DIFY_TIMEOUT_SECONDS:-60}
      FEISHU_APP_ID: ${FEISHU_APP_ID:-}
      FEISHU_APP_SECRET: ${FEISHU_APP_SECRET:-}
      FEISHU_VERIFICATION_TOKEN: ${FEISHU_VERIFICATION_TOKEN:-}
      FEISHU_ENCRYPT_KEY: ${FEISHU_ENCRYPT_KEY:-}
      FEISHU_DEFAULT_CHAT_ID: ${FEISHU_DEFAULT_CHAT_ID:-}
      FEISHU_LONG_CONNECTION_ENABLED: ${FEISHU_LONG_CONNECTION_ENABLED:-false}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks:
      - goalbot-net

  goalbot-frontend:
    build:
      context: ./goalbot-frontend
      dockerfile: Dockerfile
    container_name: goalbot-frontend
    restart: unless-stopped
    depends_on:
      - goalbot-backend
    ports:
      - "${HTTP_BIND_ADDRESS:-127.0.0.1}:${HTTP_PORT:-18080}:80"
    networks:
      - goalbot-net

  goalbot-frpc:
    image: ${FRPC_IMAGE:-snowdreamtech/frpc:latest}
    container_name: goalbot-frpc
    profiles:
      - tunnel
    restart: unless-stopped
    depends_on:
      - goalbot-frontend
    command:
      - -c
      - /etc/frp/frpc.toml
    environment:
      FRP_SERVER_ADDR: ${FRP_SERVER_ADDR:-}
      FRP_SERVER_PORT: ${FRP_SERVER_PORT:-7000}
      FRP_AUTH_TOKEN: ${FRP_AUTH_TOKEN:-}
      FRP_REMOTE_PORT: ${FRP_REMOTE_PORT:-18080}
    volumes:
      - ./deploy/frp/local/frpc.toml:/etc/frp/frpc.toml:ro
    networks:
      - goalbot-net

volumes:
  goalbot_mysql_data:

networks:
  goalbot-net:
    driver: bridge
