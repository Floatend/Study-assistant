server:
  port: ${SERVER_PORT:8080}

spring:
  application:
    name: linge-site-backend
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: ${MYSQL_URL:jdbc:mysql://localhost:3306/goalbot?useUnicode=true&characterEncoding=utf8&useSSL=false&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true}
    username: ${MYSQL_USERNAME:root}
    password: ${MYSQL_PASSWORD:1234}
  jackson:
    time-zone: Asia/Shanghai
    date-format: yyyy-MM-dd HH:mm:ss

mybatis-plus:
  mapper-locations: classpath*:/mapper/**/*.xml
  configuration:
    map-underscore-to-camel-case: true
  global-config:
    db-config:
      id-type: auto

site:
  auth:
    session-days: ${SITE_AUTH_SESSION_DAYS:${GOALBOT_AUTH_SESSION_DAYS:30}}
    bootstrap-admin-username: ${SITE_BOOTSTRAP_ADMIN_USERNAME:${GOALBOT_BOOTSTRAP_ADMIN_USERNAME:local_user}}
    bootstrap-admin-password: ${SITE_BOOTSTRAP_ADMIN_PASSWORD:${GOALBOT_BOOTSTRAP_ADMIN_PASSWORD:}}

logging:
  level:
    com.example.goalbot: info
